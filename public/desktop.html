<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitFinder</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/content.css">
  <link rel="stylesheet" href="styles/detail.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <button class="nav-btn" id="btn-back" title="后退">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="前进">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="btn-up" title="上级目录">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
        <div class="breadcrumbs" id="breadcrumbs"></div>
      </div>
      <div class="toolbar-center">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="搜索仓库...">
        </div>
      </div>
      <div class="toolbar-right">
        <div class="view-switcher">
          <button class="view-btn active" data-view="tree" title="目录树">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="6" y1="12" x2="21" y2="12"></line>
              <line x1="6" y1="18" x2="15" y2="18"></line>
            </svg>
          </button>
          <button class="view-btn" data-view="grid" title="平铺">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </button>
          <button class="view-btn" data-view="group" title="仓库组">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </button>
        </div>
        <button class="nav-btn" id="btn-settings" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">显示模式</div>
          <div class="sidebar-item active" data-mode="tree">
            <span class="sidebar-icon">☰</span>
            <span>目录树</span>
          </div>
          <div class="sidebar-item" data-mode="grid">
            <span class="sidebar-icon">⬚</span>
            <span>平铺模式</span>
          </div>
          <div class="sidebar-item" data-mode="group">
            <span class="sidebar-icon">⊞</span>
            <span>仓库组</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">位置</div>
          <div id="quick-locations"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">收藏夹</div>
          <div id="favorites-list"></div>
          <button class="sidebar-add-btn" id="add-favorite-btn">+ 添加收藏</button>
        </div>

        <div class="sidebar-section" id="groups-sidebar-section">
          <div class="sidebar-title">仓库组</div>
          <div id="groups-list"></div>
          <button class="sidebar-add-btn" id="add-group-btn">+ 新建组</button>
        </div>

        <div class="sidebar-section" id="tags-sidebar-section">
          <div class="sidebar-title">标签</div>
          <div id="tags-filter-list"></div>
        </div>
      </aside>

      <main class="content-area">
        <div class="tag-filter-bar" id="tag-filter-bar" style="display: none;">
          <span class="filter-label">筛选标签：</span>
          <div id="tag-filter-chips"></div>
          <button class="clear-filter-btn" id="clear-tag-filter">清除</button>
        </div>
        <div class="sort-bar" id="sort-bar">
          <span class="sort-label">排序：</span>
          <div class="sort-options">
            <button class="sort-btn active" data-sort="name">名称</button>
            <button class="sort-btn" data-sort="path">路径</button>
            <button class="sort-btn" data-sort="dir">目录</button>
            <button class="sort-btn" data-sort="status">Git状态</button>
            <button class="sort-btn" data-sort="time">修改时间</button>
            <button class="sort-btn" data-sort="size">大小</button>
            <button class="sort-btn" data-sort="branch">分支</button>
          </div>
          <div class="sort-direction">
            <button class="dir-btn active" data-dir="asc">↑</button>
            <button class="dir-btn" data-dir="desc">↓</button>
          </div>
          <div class="card-style-switch">
            <button class="style-btn active" data-style="card">卡片</button>
            <button class="style-btn" data-style="list">列表</button>
          </div>
        </div>
        <div class="content-scroll" id="content-scroll">
          <div id="content-area"></div>
          <div id="empty-state" style="display:none;">
            <div class="empty-icon">📁</div>
            <div class="empty-text">选择一个目录开始浏览</div>
            <button class="btn btn-primary" id="choose-folder-btn">选择文件夹</button>
          </div>
        </div>
      </main>

      <aside class="detail-panel" id="detail-panel">
        <div class="detail-empty" id="detail-empty">
          <div class="detail-empty-icon">📋</div>
          <div class="detail-empty-text">选择一个仓库查看详情</div>
        </div>
        <div class="detail-content" id="detail-content" style="display:none;">
          <div class="detail-header">
            <h3 id="detail-name">仓库名称</h3>
            <div class="detail-path" id="detail-path">/path/to/repo</div>
            <div class="detail-status" id="detail-status"></div>
          </div>
          <div class="detail-section">
            <h4>README</h4>
            <div class="detail-readme" id="detail-readme"></div>
          </div>
          <div class="detail-section">
            <h4>Git 信息</h4>
            <div class="detail-git-info" id="detail-git-info"></div>
          </div>
          <div class="detail-section">
            <h4>标签</h4>
            <div class="detail-tags" id="detail-tags"></div>
            <button class="btn btn-small" id="add-tag-btn">+ 添加标签</button>
          </div>
          <div class="detail-section">
            <h4>操作</h4>
            <div class="detail-actions">
              <button class="btn btn-primary" id="detail-pull-btn">拉取</button>
              <button class="btn btn-success" id="detail-push-btn">推送</button>
              <button class="btn" id="detail-fetch-btn">Fetch</button>
              <button class="btn btn-warning" id="detail-commit-btn">提交</button>
              <button class="btn" id="detail-open-btn">在Finder中显示</button>
              <button class="btn" id="detail-terminal-btn">打开终端</button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <footer class="status-bar">
      <div class="status-left" id="status-left">就绪</div>
      <div class="status-center" id="status-center"></div>
      <div class="status-right" id="status-right"></div>
    </footer>
  </div>

  <div class="modal-overlay" id="commit-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>提交变更</h3>
        <button class="modal-close" data-modal="commit-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>提交信息</label>
          <textarea id="commit-message" rows="4" placeholder="请输入提交信息..."></textarea>
        </div>
        <div class="form-group">
          <label>变更文件</label>
          <div id="commit-files" class="commit-files"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-modal="commit-modal">取消</button>
        <button class="btn btn-primary" id="confirm-commit-btn">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="new-group-modal" style="display:none;">
    <div class="modal modal-small">
      <div class="modal-header">
        <h3>新建仓库组</h3>
        <button class="modal-close" data-modal="new-group-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>组名称</label>
          <input type="text" id="new-group-name" placeholder="输入组名称">
        </div>
        <div class="form-group">
          <label>颜色</label>
          <div class="color-picker" id="group-color-picker">
            <div class="color-option active" data-color="#007AFF" style="background:#007AFF"></div>
            <div class="color-option" data-color="#34C759" style="background:#34C759"></div>
            <div class="color-option" data-color="#FF9500" style="background:#FF9500"></div>
            <div class="color-option" data-color="#FF3B30" style="background:#FF3B30"></div>
            <div class="color-option" data-color="#AF52DE" style="background:#AF52DE"></div>
            <div class="color-option" data-color="#FFCC00" style="background:#FFCC00"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-modal="new-group-modal">取消</button>
        <button class="btn btn-primary" id="confirm-new-group-btn">创建</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="new-tag-modal" style="display:none;">
    <div class="modal modal-small">
      <div class="modal-header">
        <h3>新建标签</h3>
        <button class="modal-close" data-modal="new-tag-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>标签名称</label>
          <input type="text" id="new-tag-name" placeholder="输入标签名称">
        </div>
        <div class="form-group">
          <label>颜色</label>
          <div class="color-picker" id="tag-color-picker">
            <div class="color-option active" data-color="#007AFF" style="background:#007AFF"></div>
            <div class="color-option" data-color="#34C759" style="background:#34C759"></div>
            <div class="color-option" data-color="#FF9500" style="background:#FF9500"></div>
            <div class="color-option" data-color="#FF3B30" style="background:#FF3B30"></div>
            <div class="color-option" data-color="#AF52DE" style="background:#AF52DE"></div>
            <div class="color-option" data-color="#FFCC00" style="background:#FFCC00"></div>
            <div class="color-option" data-color="#5AC8FA" style="background:#5AC8FA"></div>
            <div class="color-option" data-color="#FF2D55" style="background:#FF2D55"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-modal="new-tag-modal">取消</button>
        <button class="btn btn-primary" id="confirm-new-tag-btn">创建</button>
      </div>
    </div>
  </div>

  <script src="scripts/app.js"></script>
  <script src="scripts/sidebar.js"></script>
  <script src="scripts/content.js"></script>
  <script src="scripts/detail.js"></script>
  <script src="scripts/git.js"></script>
</body>
</html>
